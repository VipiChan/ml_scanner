[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-scan"
version = "0.1.0"
description = "Nifty 500 multi-timeframe ML scanner, backtester, and execution pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "exchange-calendars>=4.5,<5",
    "pandas-ta>=0.3.14b,<1",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<3",
    "lightgbm>=4.5,<5",
    "boruta>=0.4,<1",
    "statsmodels>=0.14,<1",
    "joblib>=1.4,<2",
    "pyarrow>=16.0,<22",
    "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
]
notebook = [
    "jupyter>=1.1,<2",
    "ipywidgets>=8.1,<9",
    "matplotlib>=3.9,<4",
]

[project.scripts]
ml-scan = "ml_scan.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "timescale: requires a running TimescaleDB (scan_trade instance on :5433)",
]
filterwarnings = [
    "ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning",
]
